[project]
name = "skilly-ingest"
version = "0.1.0"
description = "Lesson-docs ingestion: parse, chunk, embed, store"
requires-python = ">=3.12"
dependencies = ["pypdf>=6.21.4", "beautifulsoup4>=4.12"]

[project.scripts]
skilly-seed = "ingest.seed:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.uv]
# Supply-chain guard: ignore releases newer than two weeks before this was written.
exclude-newer = "2026-10-19T00:00:00Z"
# Security exception (2026-11-02, Phase 6): pypdf <6.21.4 has 10 DoS advisories; allow the fixed release past the cutoff.
exclude-newer-package = { pypdf = "2026-11-02T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests"]
