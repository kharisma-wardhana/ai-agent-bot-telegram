[project]
name = "skilly-kaggle"
version = "0.1.0"
description = "Kaggle side: vLLM auth proxy, heartbeat, PDF/HTML ingest loop"
requires-python = ">=3.12"
# vllm, boto3 and cloudflared are installed in the Kaggle notebook itself (GPU-only, heavy); not needed for tests.
dependencies = ["skilly-ingest"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
skilly-ingest = { path = "../ingest", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skilly_kaggle"]

[tool.uv]
exclude-newer = "2026-10-19T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
